name: SOXL ALPHA Forward Test

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: soxl-alpha-forward
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SOXL paper trading
        run: python run_alpha_forward.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_data/
          if ! git diff --cached --quiet; then
            git commit -m "Update SOXL forward test"
            git push
          fi
